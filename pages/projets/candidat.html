<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" type="text/css" href="./../../css/reset.css" />
        <link rel="stylesheet" type="text/css" href="./../../css/style.css" />
        <link rel="stylesheet" type="text/css" href="./../../css/slider.css" />
        <link rel="icon" type="image/png" href="./../../images/logo.jpg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.cdnfonts.com/css/cascadia-code"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=PT+Sans&display=swap"
            rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
        <title>Site de campagne</title>
    </head>
    <body>
        <article class="sous_partie">
            <div class="sous_partie_titre">
                <h2 class="color-g">Site de campagne</h2>
                <div class="technos">
                    <img
                        src="./../../images/technos/css.svg"
                        class="img-techno"
                        alt="logo css" />
                    <img
                        src="./../../images/technos/js.svg"
                        class="img-techno"
                        alt="logo javascript" />
                    <img
                        src="./../../images/technos/WordPress-logotype-wmark-white.png"
                        class="img-techno"
                        alt="logo javascript" />
                </div>
            </div>
            <!-- CAROUSEL -->
            <div class="slide-container">
                <div class="slide fade">
                    <div class="slide-index"></div>
                    <img
                        class="slide-img"
                        src="./../../images/projets/candidat/trombinoscope.png"
                        alt="ecommerce audio page de recherche"
                        class="block_center"
                        height="500" />
                    <div class="slide-text">Trombinoscope</div>
                </div>

                <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
                <a class="next" onclick="plusSlides(1)">&#10095;</a>
            </div>
            <br />
            <div class="slide-dot"></div>
            <!-- FIN CAROUSEL -->

            <h3>Site de campagne</h3>

            <p>Le site de campagne d'un candidat aux municipales</p>

            <!-- <a class="block link_project" href="" target="_blank"
                >Lien vers le code</a
            > -->
        </article>
        <script src="./../../js/slider.js"></script>
    </body>
