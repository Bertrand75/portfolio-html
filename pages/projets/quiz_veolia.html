<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" type="text/css" href="./../../css/reset.css" />
        <link rel="stylesheet" type="text/css" href="./../../css/style.css" />
        <link rel="stylesheet" type="text/css" href="./../../css/slider.css" />
        <link rel="icon" type="image/png" href="./../../images/logo.jpg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.cdnfonts.com/css/cascadia-code"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=PT+Sans&display=swap"
            rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
        <title>Quiz Veolia</title>
    </head>
    <body>
        <article class="sous_partie">
            <div class="sous_partie_titre">
                <h2 class="color-g">Quiz Veolia</h2>
                <div class="technos">
                    <img
                        src="./../../images/technos/html.svg"
                        class="img-techno"
                        alt="logo html" />
                    <img
                        src="./../../images/technos/css.svg"
                        class="img-techno"
                        alt="logo css" />
                    <img
                        src="./../../images/technos/js.svg"
                        class="img-techno"
                        alt="logo javascript" />
                    <img
                        src="./../../images/technos/php.svg"
                        class="img-techno"
                        alt="logo php" />
                    <img
                        src="./../../images/technos/mysql.svg"
                        class="img-techno"
                        alt="logo MySql" />
                </div>
            </div>
            <!-- CAROUSEL -->
            <div class="slide-container">
                <div class="slide fade">
                    <div class="slide-index"></div>
                    <img
                        class="slide-img"
                        src="./../../images/projets/quiz_elior/quiz_veolia_elior_tf1.png"
                        alt="Question du quiz"
                        class="block_center"
                        height="500" />
                    <div class="slide-text">
                        Exemple de question du quiz Veolia/Elior/TF1 (floutée
                        par soucis de confidentialité)
                    </div>
                </div>

                <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
                <a class="next" onclick="plusSlides(1)">&#10095;</a>
            </div>
            <br />
            <div class="slide-dot"></div>

            <!-- FIN CAROUSEL -->

            <h3>Une série de quiz pour Veolia</h3>

            <p>A suivre</p>

            <!-- <a
                class="block link_project"
                href="https://github.com/Bertrand75/react-relances"
                target="_blank"
                >Lien vers le code du front-end</a
            >
            <a
                class="block link_project"
                href="https://github.com/Bertrand75/node-relances"
                target="_blank"
                >Lien vers le code du back-end</a
            > -->
        </article>
        <script src="./../../js/slider.js"></script>
    </body>
</html>
