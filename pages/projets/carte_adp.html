        <link rel="stylesheet" type="text/css" href="./../../css/reset.css" />
        <link rel="stylesheet" type="text/css" href="./../../css/style.css" />
        <link rel="stylesheet" type="text/css" href="./../../css/slider.css" />
        <link rel="icon" type="image/png" href="./../../images/logo.jpg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />

        <link

        <link

        <title>Carte interactive</title>

    <body>
        <article class="sous_partie">
            <h2 class="color-g">Carte interactive ADP</h2>
            <div class="technos">
                <img
                    src="./../../images/technos/html.svg"
                    class="img-techno"
                    alt="logo html" />
                <img
                    src="./../../images/technos/css.svg"
                    class="img-techno"
                    alt="logo css" />
                <img
                    src="./../../images/technos/js.svg"
                    class="img-techno"
                    alt="logo javascript" />
                <img
                    src="./../../images/technos/php.svg"
                    class="img-techno"
                    alt="logo php" />
                <img
                    src="./../../images/technos/mysql.svg"
                    class="img-techno"
                    alt="logo MySql" />
            </div>
            <!-- CAROUSEL -->
            <div class="slide-container">
                <div class="slide fade">
                    <div class="slide-index"></div>

                    <video
                        height="500"
                        class="slide-img"
                        src="./../../images/projets/carte_cdg/Carte_demo_2.mp4"></video>
                    <div class="slide-text">Video de démonstration</div>
                </div>
            </div>
            <br />
            <div class="slide-dot"></div>
            <!-- FIN CAROUSEL -->

            <h3>Une carte interactive pour ADP</h3>

            <p>A suivre</p>
